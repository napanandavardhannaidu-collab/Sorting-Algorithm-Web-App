<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="Sorting Algoritm Web App logo">
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b0f19"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#070a12"/></linearGradient>
<linearGradient id="ring" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#38bdf8"/><stop offset=".35" stop-color="#6366f1"/><stop offset=".7" stop-color="#a855f7"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="core" x1="0" x2="0" y1="1" y2="0"><stop stop-color="#111827"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes counter{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes sweep{from{transform:rotate(0deg);opacity:.85}50%{opacity:.25}to{transform:rotate(360deg);opacity:.85}}
@keyframes wave{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.18)}}
@keyframes swapA{0%,100%{transform:translate(0)}20%{transform:translateY(-14px)}42%{transform:translate(42px,-14px)}60%{transform:translate(42px)}}
@keyframes swapB{0%,100%{transform:translate(0)}20%{transform:translateY(14px)}42%{transform:translate(-42px,14px)}60%{transform:translate(-42px)}}
.orbit{transform-origin:250px 250px;animation:orbit 24s linear infinite}.counter{transform-origin:250px 250px;animation:counter 17s linear infinite}.sweep{transform-origin:250px 250px;animation:sweep 6s ease-in-out infinite}.bar{transform-origin:center bottom}.bar1,.bar4,.bar5{animation:wave 3s ease-in-out infinite}.bar2{animation:swapA 5s ease-in-out infinite}.bar3{animation:swapB 5s ease-in-out infinite}.bar4{animation-delay:.35s}.bar5{animation-delay:.6s}
</style>
</defs>
<circle cx="250" cy="250" r="236" fill="url(#bg)" stroke="#1e293b" stroke-width="3"/>
<circle cx="250" cy="250" r="140" fill="#2563eb" opacity=".12" filter="url(#glow)"/>
<circle cx="250" cy="250" r="226" fill="none" stroke="#334155" stroke-opacity=".55"/>
<circle class="orbit" cx="250" cy="250" r="220" fill="none" stroke="url(#ring)" stroke-dasharray="12 18 36 14 6 22" stroke-linecap="round" stroke-width="3"/>
<g class="orbit"><circle cx="250" cy="30" r="5" fill="#38bdf8"/><circle cx="470" cy="250" r="4" fill="#a855f7"/><circle cx="250" cy="470" r="5" fill="#ec4899"/></g>
<circle class="counter" cx="250" cy="250" r="185" fill="none" stroke="#6366f1" stroke-dasharray="6 24 18 30" stroke-width="2" opacity=".75"/>
<g class="counter"><circle cx="250" cy="65" r="4" fill="#6366f1"/><circle cx="435" cy="250" r="3" fill="#38bdf8"/><circle cx="65" cy="250" r="4" fill="#a855f7"/></g>
<g class="sweep"><path d="M250 250L360 140A155 155 0 0 0 250 95Z" fill="url(#ring)" opacity=".12"/><line x1="250" y1="250" x2="360" y2="140" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="2"/></g>
<circle cx="250" cy="250" r="132" fill="#0a0f1d" stroke="#1e293b" stroke-width="2"/>
<g stroke="#273449" stroke-width="1" stroke-dasharray="4 4"><path d="M140 210h220M140 250h220M140 290h220"/></g><path d="M140 330h220" stroke="#334155" stroke-width="2"/>
<g class="bar bar1"><rect x="146" y="278" width="22" height="52" rx="6" fill="url(#core)"/><circle cx="157" cy="272" r="3" fill="#38bdf8"/></g>
<g class="bar bar2"><rect x="188" y="214" width="22" height="116" rx="6" fill="#4f46e5" filter="url(#glow)"/><path d="m199 202-5 8h10z" fill="#818cf8"/></g>
<g class="bar bar3"><rect x="230" y="248" width="22" height="82" rx="6" fill="#7c3aed"/><path d="m241 236-5 8h10z" fill="#a78bfa"/></g>
<g class="bar bar4"><rect x="272" y="184" width="22" height="146" rx="6" fill="#9333ea"/><circle cx="283" cy="178" r="3" fill="#c084fc"/></g>
<g class="bar bar5"><rect x="314" y="152" width="22" height="178" rx="6" fill="#db2777" filter="url(#glow)"/><circle cx="325" cy="144" r="4" fill="#ec4899"/></g>
<path d="M199 188C199 170 241 170 241 188" fill="none" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="2"/><path d="m244 186-3 6-4-6m-41 4 3-6 4 6" fill="#38bdf8"/>
<g transform="translate(250 368)"><rect x="-65" y="-13" width="130" height="26" rx="13" fill="#0f172a" stroke="#38bdf8"/><text y="4" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">O(N log N)</text></g>
<text x="250" y="104" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="4" text-anchor="middle">SORTING VISUALIZER</text>
</svg>
