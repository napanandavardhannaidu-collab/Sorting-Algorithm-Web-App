<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sorting Algoritm Web App logo">
  <style>
    .nodes { transform-origin: 32px 32px; animation: orbit 2.4s linear infinite; }
    .orbit { animation: pulse 1.8s ease-in-out infinite alternate; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  </style>
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <circle class="orbit" cx="32" cy="32" r="20" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 5"/>
  <g class="nodes">
    <circle cx="32" cy="12" r="5" fill="#38bdf8"/>
    <circle cx="49" cy="42" r="5" fill="#34d399"/>
    <circle cx="15" cy="42" r="5" fill="#fbbf24"/>
  </g>
  <path d="M32 25v14M25 32h14" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
</svg>
